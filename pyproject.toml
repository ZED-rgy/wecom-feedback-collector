[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wecom-feedback-collector"
version = "0.1.0"
description = "Windows-first WeCom customer group feedback collector"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
windows = [
  "pycryptodome>=3.20",
  "pyautogui>=0.9.54",
  "Pillow>=10.0",
  "pyperclip>=1.8.2",
  "pywinauto>=0.6.9",
  "rapidocr-onnxruntime>=1.2.3",
]
desktop = [
  "Pillow>=10.0",
  "pystray>=0.19.5",
]
build = [
  "pyinstaller>=6.0",
]

[tool.setuptools]
packages = ["wecom_feedback", "wecom_feedback.adapters", "wecom_feedback.services"]
